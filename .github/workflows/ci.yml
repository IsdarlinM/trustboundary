name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SRIC_CORE_CI_REF: 3c5d1e0eff2584d069843a5234d9d8a0357718b9

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./sric-core
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pytest ruff mypy build pip-audit hypothesis httpx PyYAML
      - name: Every public CLI command dispatch/validation smoke
        run: python -m pytest -q tests/e2e/test_all_commands_dispatch_v0514.py
      - name: Shared Security Workspace contract
        run: python -m pytest -q tests/e2e/test_security_workspace_v0514.py
      - run: python -m sric.standalone_gate --root .
      - run: python scripts/release-gate.py --quick

  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux install/uninstall preservation smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          SRIC_CORE_SOURCE: ${{ github.workspace }}/sric-core
        run: |
          TEST_HOME="${RUNNER_TEMP}/trustboundary-home"
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" sh scripts/install-linux.sh
          "$TEST_HOME/.trustboundary/venv/bin/trustboundary" init preserve
          HOME="$TEST_HOME" sh scripts/uninstall-linux.sh
          test -f "$TEST_HOME/.trustboundary/workspaces/preserve/workspace.json"
      - name: Windows install/uninstall preservation smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'trustboundary-home'
          $env:SRIC_CORE_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'sric-core'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          cmd /c scripts\install-windows.cmd
          $runtime = "$env:USERPROFILE\.trustboundary\venv\Scripts\trustboundary.exe"
          & $runtime version
          & $runtime doctor --json
          & $runtime capabilities
          & $runtime init preserve
          cmd /c scripts\uninstall-windows.cmd
          if (Test-Path "$env:USERPROFILE\.trustboundary\venv") { throw 'runtime venv was not removed' }
          if (-not (Test-Path "$env:USERPROFILE\.trustboundary\workspaces\preserve\workspace.json")) { throw 'workspace data was removed' }
